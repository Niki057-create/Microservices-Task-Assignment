apiVersion: v1
kind: Secret
metadata:
  name: gateway-service-secret
type: Opaque
data:
  MONGODB_URI: bW9uZ29kYitzcnY6Ly9uaWtpdGhhYmFsYWppMTQzOkFuZ2VsMDUwN0BuaWtpdGhhLjBxemI1ZmsubW9uZ29kYi5uZXQvbWljcm9zZXJ2aWNlc19nYXRld2F5
  USER_SERVICE_URL: aHR0cDovL3VzZXItc2VydmljZTozMDAw
  PRODUCT_SERVICE_URL: aHR0cDovL3Byb2R1Y3Qtc2VydmljZTozMDAx
  ORDER_SERVICE_URL: aHR0cDovL29yZGVyLXNlcnZpY2U6MzAwMg==
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: nikitha055/microservices-gateway-service:latest
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: gateway-service-secret
                  key: MONGODB_URI
            - name: USER_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-service-secret
                  key: USER_SERVICE_URL
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-service-secret
                  key: PRODUCT_SERVICE_URL
            - name: ORDER_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-service-secret
                  key: ORDER_SERVICE_URL
          resources:
            requests:
              cpu: "150m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            tcpSocket:
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
---

apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  labels:
    app: gateway-service
spec:
  type: ClusterIP
  selector:
    app: gateway-service
  ports:
    - name: http
      port: 3003
      targetPort: 3003