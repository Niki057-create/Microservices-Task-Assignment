apiVersion: v1
kind: Secret
metadata:
  name: order-service-secret
type: Opaque
data:
  MONGODB_URI: bW9uZ29kYitzcnY6Ly9uaWtpdGhhYmFsYWppMTQzOkFuZ2VsMDUwN0BuaWtpdGhhLjBxemI1ZmsubW9uZ29kYi5uZXQvbWljcm9zZXJ2aWNlc19vcmRlcnM=
  PRODUCT_SERVICE_URL: aHR0cDovL3Byb2R1Y3Qtc2VydmljZTozMDAx
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: nikitha055/microservices-order-service:latest
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: order-service-secret
                  key: MONGODB_URI
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: order-service-secret
                  key: PRODUCT_SERVICE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /orders
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /orders
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
---

apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 3002
      targetPort: 3002